name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies (Raylib & LCOV)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            lcov

      - name: Configure CMake
        run: |
          cmake -B build \
            ${{ runner.os == 'Linux' && '-DCMAKE_BUILD_TYPE=Debug' || '' }} \
            -DENABLE_COVERAGE=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}

      - name: Build Executables
        run: cmake --build build --config Debug

      - name: Run Catch2 Unit Tests via CTest
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Generate and Display LCOV Report
        if: runner.os == 'Linux'
        run: |
          lcov --capture --directory build --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/_deps/*' '*/tests/*' --output-file coverage.filtered.info
          lcov --list coverage.filtered.info
